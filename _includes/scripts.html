{% include base_path %}
<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>

<!-- 本站脚本：BibTeX 复制、引用复制、缩略图导航等渐进增强。
     用 async 而不是 defer：defer 脚本严格按文档顺序执行，页脚里曾经有一条
     defer 的 MathJax（jsDelivr），外链一慢就把排在它后面的 han.js 一起拖住
     （实测缩略图要等 14～19 秒，见 README 第三章第 5 节）。MathJax 现已移除，
     但 async 保留 —— han.js 不依赖其他脚本、也不等 DOMContentLoaded，
     脚本内部按「解析完成」起步（见 han.js 第 5 节），缩略图能在解析一结束就出现。 -->
{% if page.url == '/' or page.url == '/en/' %}
<!-- vivus.js（MIT，maxwellito/vivus v0.4.6，npm dist 原样引入）：主页侧栏线稿自绘。
     同步加载且排在下面 async 的 han.js 之前——async 脚本要等解析到标签才开始下载，
     因此 han.js 第 8 节执行时 window.Vivus 必然已就绪，不存在竞态。 -->
<script src="{{ base_path }}/assets/js/vivus.js"></script>
{% endif %}
<script src="{{ base_path }}/assets/js/han.js" async></script>

{% include analytics.html %}
