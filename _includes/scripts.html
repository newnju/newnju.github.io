<!-- 本站脚本：BibTeX 复制、引用复制、缩略图导航等渐进增强。
     用 async 而不是 defer：defer 脚本严格按文档顺序执行，而页脚里 defer 的 MathJax
     来自 jsDelivr，外链一慢就把排在它后面的 han.js 一起拖住（实测缩略图要等 14～19 秒）。
     async 不受这条队列约束，脚本一到位就能跑；脚本内部按「解析完成」起步（见 han.js 第 5 节），
     不依赖 DOMContentLoaded，因此缩略图能在解析一结束就出现。 -->
<script src="{{ base_path }}/assets/js/han.js" async></script>
