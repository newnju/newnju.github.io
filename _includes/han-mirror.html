<!-- ==========================================================================
     博局镜（规矩镜）纹样结构 · 首页装饰
     --------------------------------------------------------------------------
     手绘 SVG（无需外部脚本生成）；要调纹饰直接改本文件。
     依据论文《四神博局镜与汉代宇宙观》的实物拓片与结构图：
       · 各层半径按拓片实测：素缘 194-199 · 云气纹 174-194 · 锯齿纹 148-174
         栉齿纹 133-148 · 铭文带 114-133 · 内区 58-114 · 方框半边长 58
       · T 纹在方框四边正中向外伸出，反 L 纹与 T 纹相对、在四方轴线上，
         V 纹在方框四角、尖角朝镜心；十二乳钉与十二辰铭相间于方框内
       · 铭文取尚方镜常见吉语，字头朝内（与实物一致）
     全部图形用 currentColor，配色随 .han-mirror 的 color 走。
     外区分成三组，在 _sass/_han.scss 里反向缓慢旋转：
       .mirror-outer       最外圈（素缘 + 云气纹）      顺时针
       .mirror-sawtooth    中间圈（锯齿纹 + 栉齿纹）    逆时针
       .mirror-inscription 铭文带                      顺时针
     内区（方框、TLV、乳钉、十二辰、镜钮）不转。
     ========================================================================== -->
