<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="武嘉文">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c6ef5"/>
      <stop offset="55%" stop-color="#5f3dc4"/>
      <stop offset="100%" stop-color="#862e9c"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="200" cy="200" r="166" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <text x="200" y="200" text-anchor="middle" dominant-baseline="central"
        font-family="'Source Han Serif SC','Noto Serif SC','Songti SC','SimSun',serif"
        font-size="188" fill="#ffffff" fill-opacity="0.97">武</text>
</svg>
