# Cloudflare Worker 配置。部署见同目录 README.md。
#
#   cd oauth-proxy && npx wrangler deploy
#
# 两个密钥用命令行喂，不要写进这个文件：
#   npx wrangler secret put GITHUB_OAUTH_ID
#   npx wrangler secret put GITHUB_OAUTH_SECRET

name = "decap-oauth"
main = "worker.js"
compatibility_date = "2025-06-01"

# 挂自己的子域。workers.dev 在部分网络下被 DNS 污染 + SNI 丢包，完全不可达，
# 所以后台登录必须走这里；workers_dev 仅作为本地调试时的备用地址保留。
route = { pattern = "oauth.oaking.kdns.fr", zone_name = "oaking.kdns.fr", custom_domain = true }
workers_dev = true
