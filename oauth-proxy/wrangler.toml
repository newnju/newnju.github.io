# Cloudflare Worker 配置。部署见同目录 README.md。
#
#   cd oauth-proxy && npx wrangler deploy
#
# 两个密钥用命令行喂，不要写进这个文件：
#   npx wrangler secret put GITHUB_OAUTH_ID
#   npx wrangler secret put GITHUB_OAUTH_SECRET

name = "decap-oauth"
main = "worker.js"
compatibility_date = "2025-06-01"

# 用 Cloudflare 自带的 <名字>.<账号>.workers.dev 域名。
# 想换成自己的子域（例如 decap.example.com）就取消下面的注释并改成自己的：
# route = { pattern = "decap.example.com", zone_name = "example.com", custom_domain = true }
workers_dev = true
