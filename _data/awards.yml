# ==========================================================================
# 获奖与荣誉数据（/timeline/ 页面的唯一数据源）
# --------------------------------------------------------------------------
# 维护方法：只改本文件，页面自动更新。按年份倒序排列。
#
# 每一条的结构：
#   - text  : 必填，获奖名称
#     level : 选填，等级标签。可选值（决定标签颜色）：
#               international 国际 / national 国家级 / provincial 省级
#               school 校级 / other 其他
#             标签文字取自 _data/ui-text.yml 的 award_level_* 键，中英自动切换
#     note  : 选填，补充说明（颁发单位、事由等），显示为小字
#
# 新增一条：复制下面任意一条改掉文字即可。加一个新年份就加一个 - year 分组。
#
# 「key: honours」这一组是荣誉（而非获奖），会单独渲染到首页的「荣誉」小节，
# 所以它的内容就是主页上显示的那几条。首页与时间轴都按 key 取，改 year 的显示文字不影响。
# text_en / year_en 选填，英文页优先取它们、缺省回落中文。
# ==========================================================================

