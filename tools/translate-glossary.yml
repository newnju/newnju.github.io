# 自动翻译术语表（tools/translate-en.mjs 读）
# ---------------------------------------------------------------------------
# 为什么要有这张表：翻译模型不认识「四神博局镜」，直译会给出 "four gods board
# game mirror" 这种外行译名；「南京大学新闻传播学院」逐词翻出来是
# "Nanjing University School of Journalism and Communication"，而站内人工译文
# 一直是 "School of Journalism and Communication, Nanjing University"（院系在前）。
#
# 机制：术语在送进模型前先挖成占位符（⟦3⟧），随文附一份对照说明，模型原样带
# 回来。所以这里写的英文就是**逐字**进入输出的，不需要靠 prompt 祈祷。
#
# 词条从现有英文页**倒推**出来 —— 英文页是人工润色过的，那里的译法就是本站的
# 既定口径；新译文必须跟它一致，否则同一句话会在站内出现两种说法。
# 改这里的译法 = 改全站口径，同时记得回头改已经译好的 *_en 字段。
#
# 只收「通用翻译一定会译错或译得不一样」的词。三类：
#   1. 专名（器物、人名、机构全称）—— 直译会变成外行词；
#   2. 有固定英文写法的字段值（学位、奖项等级）；
#   3. 语序与本站既有习惯相反的机构名（院系在前）。
# 刻意**不收**：单个通用词（获 / 优秀 / 研究 / 重点）—— 模型本来就译得对，
# 硬塞进去反而打断句子；数字、日期、缩写（UCLA、GB/T 等）由 protect() 自动保护；
# citation / location / daterange / date 这类有固定格式的字段工具根本不翻。

