name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 第一道关：内容校验 + 生成物同步 + 渲染回归测试。
  # 放在构建之前 —— 数据出问题时，失败信息比「Jekyll 挂了」好懂得多。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  # 第二道关：真的把站点构建出来。
  # 与 check 分开跑（各自独立的 runner），构建机上没有 node_modules，
  # 因此 _site 里也不会混进 npm 装的东西。
  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: bundle install
        run: |
          gem install bundler -v '~> 2.4'
          bundle install --jobs 4 --retry 3
      - name: jekyll build
        run: bundle exec jekyll build --strict_front_matter --trace
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 部署。仓库的 Pages 源还没切成 GitHub Actions 时这里会跳过（不是失败），
  # 所以可以把本文件先推上去、等 Actions 变绿，再手动切源。
  preflight:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      deploy: ${{ steps.state.outputs.deploy }}
    steps:
      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" || true)
          if [ "$code" != "200" ]; then
            echo "::error::读取 Pages 设置失败（HTTP $code）—— 令牌没有 pages 读权限，无法判断是否该部署"
            cat /tmp/pages.json || true
            exit 1
          fi
          build_type=$(jq -r '.build_type // empty' /tmp/pages.json)
          echo "Pages build_type=$build_type"
          if [ "$build_type" = "workflow" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Pages 源还不是 GitHub Actions（build_type=$build_type），跳过部署。切到 Settings → Pages → Source → GitHub Actions 后重新跑一次即可。"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.deploy == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
