name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 第一道关：内容校验 + 生成物同步 + 渲染回归测试。
  # 放在构建之前 —— 数据出问题时，失败信息比「Jekyll 挂了」好懂得多。
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      # 图标审计：页面里用到的 fa 图标都在子集字体里（加新图标要 npm run fonts）
      - run: npm run check:icons
      # 中英同步提醒：改了中文却没动 *_en 时提一句。
      # 只报不挡 —— 英文措辞得人翻，忘了改不是构建错误。
      # BASE_SHA 用 push 前的那个提交，这样一次推送里含多个提交也能覆盖到。
      - name: en sync reminder
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: npm run check:en
      # 同一件事的另一半：tools/translate-en.mjs 记着每个 *_en 对应的中文哈希，
      # 中文改了而英文没跟上时这里点出来。离线检查（--check 不调模型），
      # 同样只报不挡 —— 自动译文要人过一遍，不能让它挡住部署。
      - name: zh/en translation drift reminder
        if: github.event_name == 'push'
        run: npm run check:translate

  # 第二道关：真的把站点构建出来。
  # 与 check 分开跑（各自独立的 runner），check 那边失败就不会浪费构建时间。
  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: bundle install
        run: |
          gem install bundler -v '~> 2.4'
          bundle install --jobs 4 --retry 3
      # node 必须在 jekyll build 之前装好 —— 生成器要用 gray-matter / js-yaml。
      # 构建机上因此会有 node_modules，但 _config.yml 的 exclude 里挡着
      # node_modules，不会混进 _site。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # min 产物与源码逐字节同步：谁改了 assets/js/*.js 忘跑 npm run
      # build:js，线上跑的还是旧逻辑且无任何提示。uglify-js 版本被
      # package-lock 钉死，重跑结果确定，不会误报。
      - name: minified js in sync with sources
        run: npm run check:min-sync
      # 后台（Decap）只能写文件，跑不了生成器。所以在后台改完任何内容之后，
      # _includes/generated/* 一定是过期的 —— 每次构建都重新生成，别信仓库里那份。
      - name: regenerate content fragments
        run: npm run build:content
      - name: jekyll build
        run: bundle exec jekyll build --strict_front_matter --trace
        env:
          JEKYLL_ENV: production
      # 第三道关：只看构建产物 —— 列表塌成一段、Liquid 被删这类问题
      # Jekyll 一律「构建成功」，必须在部署前从 HTML 上面拦。
      - name: structure checks on _site
        run: npm run check:structure
      # 第四、五道关都要真浏览器，装一次就够。
      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: install chromium
        run: npx playwright install --with-deps chromium
      # 第四道关：顺着页面里的链接爬一遍，抓「构建成功但 HTML 是坏的」——
      # 重复 id、假链接 href="#"、站内 404、缺 alt、横向溢出、JS 报错。
      # 这类问题构建日志里一个字都不会提。
      - name: link and a11y checks on _site
        run: npm run check:links
      # 同一批浏览器，顺手把交互也断言一遍：主题切换、联系方式折叠、
      # 顶栏折行与高度变量。截图只能看外观，看不出「点了有没有反应」——
      # 去掉 jQuery 那类改动正是靠它守住行为一致的。
      - name: dom behavior checks on _site
        run: npm run check:behavior
      # 内联脚本语法守门：对最终 _site HTML（压缩后形态）里的每个可执行
      # 内联 <script> 做 vm 语法校验 —— compress_html 把 // 注释压成一行
      # 吞掉整段代码的故障（404 页事故）在此拦下，Jekyll 构建不看这个。
      - name: inline script syntax on _site
        run: npm run check:inline-js
      # 404 页专属行为断言：它不在导航爬取集合、也没有像素基线，是
      # 「脚本在线上死了、CI 依旧全绿」的历史首发地，单独一道关。
      - name: 404 page behavior on _site
        run: npm run check:404
      # 第五道关：把关键页面各截一张（桌面 + 手机），与基线做像素比对。
      # 截图即使用例失败也照上传，方便点开看现场。
      - name: screenshots
        run: node tools/screenshots.mjs --compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 部署。仓库的 Pages 源还没切成 GitHub Actions 时这里会跳过（不是失败），
  # 所以可以把本文件先推上去、等 Actions 变绿，再手动切源。
  preflight:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      deploy: ${{ steps.state.outputs.deploy }}
    steps:
      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" || true)
          if [ "$code" != "200" ]; then
            echo "::error::读取 Pages 设置失败（HTTP $code）—— 令牌没有 pages 读权限，无法判断是否该部署"
            cat /tmp/pages.json || true
            exit 1
          fi
          build_type=$(jq -r '.build_type // empty' /tmp/pages.json)
          echo "Pages build_type=$build_type"
          if [ "$build_type" = "workflow" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Pages 源还不是 GitHub Actions（build_type=$build_type），跳过部署。切到 Settings → Pages → Source → GitHub Actions 后重新跑一次即可。"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.deploy == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # 金丝雀：部署完成立刻对生产站抽查三条关键产物 —— 404 页有引擎挂点、
      # min 脚本可达且非空、首页 200。Pages CDN 对静态站有传播窗口（通常
      # 秒级），带 8 轮重试；这几条红了说明「上游全绿，用户看到的却不是
      # 这份」，这类事靠人工是发现不了的。
      - name: production canary
        shell: bash
        env:
          PAGES_URL: https://newnju.github.io
        run: |
          set -u
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            c404=$(curl -sS --max-time 30 -o /tmp/c404.html -w '%{http_code}' "$PAGES_URL/404.html" || true)
            cjs=$(curl -sS --max-time 30 -o /tmp/cn404.js -w '%{http_code}' "$PAGES_URL/assets/js/n404.min.js" || true)
            chome=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "$PAGES_URL" || true)
            szjs=$(wc -c < /tmp/cn404.js)
            echo "attempt $i: 404=$c404 js=$cjs(${szjs}B) home=$chome"
            if [ "$c404" = "200" ] && [ "$cjs" = "200" ] && [ "$chome" = "200" ] \
               && [ "$szjs" -gt 1000 ] \
               && grep -q 'n404-inv-canvas' /tmp/c404.html \
               && grep -q 'n404-en-data' /tmp/c404.html; then
              ok=1
              break
            fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::金丝雀未通过（${i} 轮）：404=${c404:-?} js=${cjs:-?} home=${chome:-?}"
            exit 1
          fi
          echo "✓ 金丝雀通过（第 ${i} 轮）：生产站上 404 引擎挂点、min 脚本、首页全部就位"
