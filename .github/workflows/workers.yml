# Cloudflare Workers 部署（oauth-proxy 的登录代理 + analytics 的访客统计）
# ---------------------------------------------------------------------------
# 为什么放在 CI 里：wrangler deploy 需要 Cloudflare 的 API token，那是**只能由你在
# Cloudflare 后台点出来的**（它等于把部署权限交给这个仓库），没法写进仓库。所以
# token 存在 GitHub Secrets 里，由这里的 workflow 使用 —— 部署动作在 GitHub 上完成，
# 不需要在你本机跑 wrangler。
#
# 一次性准备（详见 oauth-proxy/README.md 与 analytics/README.md）：
#   1) Cloudflare 后台建一个 API token（Workers Scripts:Edit + D1:Edit + Account:Read）
#   2) 仓库 Settings → Secrets and variables → Actions 里加这几个（名字必须一致）：
#        CLOUDFLARE_API_TOKEN     上面那个 token
#        CLOUDFLARE_ACCOUNT_ID    账号 id
#        OAUTH_GITHUB_ID          GitHub OAuth App 的 Client ID
#        OAUTH_GITHUB_SECRET      GitHub OAuth App 的 Client secret
#        OAUTH_ALLOWED_USERS      白名单，逗号分隔（如 newnju）
#        STATS_TOKEN              统计面板 / 接口的密码
#      （IP_SALT / ALLOWED_ORIGIN / RETENTION_DAYS 有默认值，可选）
#   3) 之后每次改 oauth-proxy/** 或 analytics/** 推 main，这条 workflow 自动部署。
#      也可以在 Actions 页手动触发（workflow_dispatch）。
#
# 两道保险：
#   · 先跑本仓库的测试（tests/oauth-proxy.test.mjs、tests/analytics.test.mjs），
#     门禁不过就不部署；
#   · OAUTH_ALLOWED_USERS 为空时**拒绝部署** —— 新代码是「白名单为空就 503」的默认
#     拒绝逻辑，先把 token 同步过去再发代码，否则等于把自己关在门外。

name: Workers

on:
  push:
    branches: [main]
    paths:
      - "oauth-proxy/**"
      - "analytics/**"
      - ".github/workflows/workers.yml"
  pull_request:
    paths:
      - "oauth-proxy/**"
      - "analytics/**"
      - ".github/workflows/workers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # PR 只跑测试，不碰 Cloudflare
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Worker 与统计的行为测试
        run: node --test tests/oauth-proxy.test.mjs tests/analytics.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - name: Worker 与统计的行为测试
        run: node --test tests/oauth-proxy.test.mjs tests/analytics.test.mjs

      - name: 缺少 Cloudflare 凭据就直接说清楚，别部署到一半
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::仓库 Secrets 里还缺：$missing —— 见本文件顶部的一次性准备清单"
            exit 1
          fi

      # ---- oauth-proxy：后台那扇门 ----
      - name: 部署 oauth-proxy（Decap 登录代理）
        working-directory: oauth-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OAUTH_GITHUB_ID: ${{ secrets.OAUTH_GITHUB_ID }}
          OAUTH_GITHUB_SECRET: ${{ secrets.OAUTH_GITHUB_SECRET }}
          OAUTH_ALLOWED_USERS: ${{ secrets.OAUTH_ALLOWED_USERS }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          set -eu
          # 新代码按「白名单为空就 503」工作，所以先把白名单拿在手里再发代码
          if [ -z "$OAUTH_ALLOWED_USERS" ]; then
            echo "::error::Secrets 里没有 OAUTH_ALLOWED_USERS —— 先填上再部署，否则部署完后台就登不进去了"
            exit 1
          fi
          npx wrangler@4 deploy
          put() { [ -n "$2" ] && printf '%s' "$2" | npx wrangler@4 secret put "$1" >/dev/null && echo "  secret $1 已同步" || echo "  secret $1 为空，跳过（保留线上原值）"; }
          put GITHUB_OAUTH_ID "$OAUTH_GITHUB_ID"
          put GITHUB_OAUTH_SECRET "$OAUTH_GITHUB_SECRET"
          put ALLOWED_GITHUB_USERS "$OAUTH_ALLOWED_USERS"
          put SITE_ORIGIN "$SITE_ORIGIN"
          npx wrangler@4 secret list

      # ---- analytics：访客统计 ----
      - name: 部署 analytics（访客统计）
        working-directory: analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          ANALYTICS_ALLOWED_ORIGIN: ${{ vars.ANALYTICS_ALLOWED_ORIGIN }}
          ANALYTICS_IP_SALT: ${{ vars.ANALYTICS_IP_SALT }}
          ANALYTICS_RETENTION_DAYS: ${{ vars.ANALYTICS_RETENTION_DAYS }}
        run: |
          set -eu
          # database_id 还是占位串就现场建库（D1 的 id 没法凭空写死在仓库里）。
          # 建完只改 runner 上的副本，请把日志里那行 id 提交进 wrangler.toml。
          if grep -q 'database_id = "在这里填' wrangler.toml; then
            echo "::notice::wrangler.toml 里的 database_id 还是占位串，正在通过 Cloudflare API 建库…"
            resp=$(curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"name":"site-stats"}')
            dbid=$(printf '%s' "$resp" | sed -n 's/.*"uuid":"\([^"]*\)".*/\1/p' | head -n 1)
            if [ -z "$dbid" ]; then
              echo "::error::建库失败：$resp"
              exit 1
            fi
            echo "::notice::新库 database_id=$dbid —— 请把它填回 analytics/wrangler.toml 并提交，下次就不用再建"
            sed -i "s|database_id = \"[^\"]*\"|database_id = \"$dbid\"|" wrangler.toml
          fi
          npx wrangler@4 d1 execute site-stats --file=./schema.sql
          npx wrangler@4 deploy
          put() { [ -n "$2" ] && printf '%s' "$2" | npx wrangler@4 secret put "$1" >/dev/null && echo "  secret $1 已同步" || echo "  secret $1 为空，跳过（保留线上原值）"; }
          put STATS_TOKEN "$STATS_TOKEN"
          put ALLOWED_ORIGIN "$ANALYTICS_ALLOWED_ORIGIN"
          put IP_SALT "$ANALYTICS_IP_SALT"
          put RETENTION_DAYS "$ANALYTICS_RETENTION_DAYS"
          npx wrangler@4 secret list

      - name: 部署后的健康检查
        run: |
          set -eu
          for url in https://oauth.oaking.kdns.fr/healthz https://stats.oaking.kdns.fr/healthz; do
            code=$(curl -sS -o /tmp/h -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "$url -> HTTP $code  $(cat /tmp/h 2>/dev/null | head -c 120)"
            if [ "$code" != "200" ]; then
              echo "::error::$url 健康检查没通过"
              exit 1
            fi
          done
